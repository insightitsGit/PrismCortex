name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish prismcortex to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Test
        run: pip install -e ".[dev]" && python -m pytest tests/ -q --tb=line

      - name: Build
        run: python -m build

      - name: Verify package
        run: twine check dist/*

      - name: Resolve package version
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Check if version already on PyPI
        id: pypi
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          URL="https://pypi.org/pypi/prismcortex/${VERSION}/json"
          if curl -sf "$URL" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "prismcortex==${VERSION} already on PyPI — skipping upload."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "prismcortex==${VERSION} not on PyPI — will publish."
          fi

      # Prefer repo secret PYPI_API_TOKEN; else trusted publishing (OIDC).
      # Trusted publisher: https://pypi.org/manage/project/prismcortex/settings/publishing/
      # Owner: insightitsGit · Repo: PrismCortex · Workflow: publish.yml · Environment: pypi
      - name: Publish to PyPI (API token)
        if: ${{ steps.pypi.outputs.exists != 'true' && secrets.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish to PyPI (trusted publishing)
        if: ${{ steps.pypi.outputs.exists != 'true' && secrets.PYPI_API_TOKEN == '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Publish skipped (already on PyPI)
        if: steps.pypi.outputs.exists == 'true'
        run: |
          echo "No upload needed for prismcortex==${{ steps.version.outputs.version }}."
          echo "Test/build/verify already passed."
