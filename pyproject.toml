[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prismcortex"
version = "0.2.1"
description = "Deterministic, auditable, self-consolidating memory for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Amin Parva", email = "info@insightits.com" }]
maintainers = [{ name = "Insight IT Solutions LLC", email = "info@insightits.com" }]
keywords = [
    "llm", "memory", "agents", "knowledge-graph", "deterministic", "rag",
    "bitemporal", "audit", "agent-memory", "compliance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.5",
    "numpy>=1.24",
    "cryptography>=42",
]

[project.optional-dependencies]
# Production engine: swap reference adapters for the real Insight ITS packages.
prism = [
    "prismlang>=0.1.1",
    "prismlib>=0.4.0",
    "prismrag-patch>=0.2.1",
    "prismresonance>=0.3.0",
]
# Real Gemini extraction / rendering.
gemini = ["google-genai>=0.3.0"]
# The network-reachable memory service (for multi-container deployments / benchmarks).
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["pytest>=7", "google-genai>=0.3.0", "fastapi>=0.110", "uvicorn[standard]>=0.27", "httpx>=0.27"]
# Competitive head-to-head (benchmarks/vs_mem0.py, vs_zep.py).
bench = ["mem0ai>=2.0", "zep-cloud>=2.0"]

[project.urls]
Homepage = "https://www.insightits.com/products/prismcortex.html"
Documentation = "https://github.com/insightitsGit/PrismCortex#readme"
Repository = "https://github.com/insightitsGit/PrismCortex"
"Bug Tracker" = "https://github.com/insightitsGit/PrismCortex/issues"

[tool.setuptools.packages.find]
include = ["prismcortex*"]

[tool.setuptools.package-data]
prismcortex = ["static/**/*"]
