[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prismcortex"
version = "0.1.0"
description = "Deterministic, auditable, self-consolidating memory for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amin Parva / Insight IT Solutions LLC" }]
keywords = ["llm", "memory", "agents", "knowledge-graph", "deterministic", "rag"]
dependencies = [
    "pydantic>=2.5",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Production engine: swap reference adapters for the real Insight ITS packages.
prism = [
    "prismlang>=0.1.1",
    "prismlib>=0.4.0",
    "prismrag-patch>=0.2.1",
    "prismresonance>=0.3.0",
]
# Real Gemini extraction / rendering.
gemini = ["google-genai>=0.3.0"]
# The network-reachable memory service (for multi-container deployments / benchmarks).
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["pytest>=7", "google-genai>=0.3.0", "fastapi>=0.110", "uvicorn[standard]>=0.27", "httpx>=0.27"]

[project.urls]
Homepage = "https://www.insightits.com/products/"

[tool.setuptools.packages.find]
include = ["prismcortex*"]
